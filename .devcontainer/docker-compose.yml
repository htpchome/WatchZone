services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ipc: host
    security_opt:
      - seccomp=unconfined
    volumes:
      - ../..:/workspaces:cached
      - ha-config:/config
      - codex-data:/home/node/.codex
    environment:
      # The VS Code Home Assistant extension runs in this container. Because
      # it shares Home Assistant's network namespace, the service is local.
      HASS_SERVER: http://localhost:8123
    command: sleep infinity
    network_mode: service:homeassistant
    depends_on:
      homeassistant:
        condition: service_healthy
      frigate:
        condition: service_started

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.0
    privileged: true
    extra_hosts:
      # The devcontainer shares this service's network files, including
      # /etc/hosts, so this also fixes previously saved extension URLs.
      - "homeassistant.local:127.0.0.1"
    volumes:
      - ha-config:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8123/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      - frigate

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    privileged: true
    shm_size: "256mb"
    volumes:
      - ./frigate:/config
      - frigate-media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8555:8555/tcp"
      - "127.0.0.1:8555:8555/udp"
      - "127.0.0.1:1984:1984"

volumes:
  codex-data:
  ha-config:
  frigate-media:
