services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ipc: host
    security_opt:
      - seccomp=unconfined
    volumes:
      - ../..:/workspaces:cached
      - ha-config:/config
      - codex-data:/home/node/.codex
    command: sleep infinity
    network_mode: service:homeassistant
    depends_on:
      - homeassistant
      - frigate

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.0
    privileged: true
    volumes:
      - ha-config:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:8123:8123"
    depends_on:
      - frigate

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    privileged: true
    shm_size: "256mb"
    volumes:
      - ./frigate:/config
      - frigate-media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8555:8555/tcp"
      - "127.0.0.1:8555:8555/udp"
      - "127.0.0.1:1984:1984"

volumes:
  codex-data:
  ha-config:
  frigate-media:
